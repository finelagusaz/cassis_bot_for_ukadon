name: YAYA Sample
on:
  schedule:
    # 毎時0分は GitHub 全体が混み合い、遅延や取りこぼしが起きやすいため17分にずらす
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  # keepalive ステップで workflow を有効化し直すために必要
  actions: write
concurrency:
  group: toot
  cancel-in-progress: false
jobs:
  toot:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      PYTHONUTF8: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: pip install
        run: pip install -r requirements.txt
      - name: Toot
        run: python sample.py
      # 公開リポジトリは60日間コミットが無いと schedule が自動で無効化されるため、
      # API で有効化し直して無効化タイマーをリセットする（空コミット不要）
      - name: Keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sample_yaya.yml/enable"
