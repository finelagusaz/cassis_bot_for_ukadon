name: YAYA Sample
# GitHub の schedule が動かなくなったため、外部の cron サービス（cron-job.org）から
# 毎時17分に workflow_dispatch API で起動している（README「定期実行の仕組み」参照）
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toot
  cancel-in-progress: false
jobs:
  toot:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      PYTHONUTF8: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: pip install
        run: pip install -r requirements.txt
      - name: Toot
        run: python sample.py
