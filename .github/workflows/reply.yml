name: Reply
# GitHub の schedule が動かなくなったため、外部の cron サービス（cron-job.org）から
# 5分おきに workflow_dispatch API で起動している（inputs.dry_run に "false" を渡す）
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '返事を生成して表示するだけで、投稿しない'
        type: boolean
        default: true
      auth_check:
        description: 'Claude API の認証（ID フェデレーション）だけを確認する（メンションは処理しない）'
        type: boolean
        default: false
      test_message:
        description: '試しに返事をさせる文面（「/」区切りで複数）。入れるとメンションは処理しない。ログは公開される'
        type: string
        default: ''
permissions:
  contents: read
  # Claude API の ID フェデレーション（WIF）で GitHub の OIDC トークンを使うために必要
  id-token: write
concurrency:
  group: reply
  cancel-in-progress: false
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      # Claude API の認証は、Variables に ID フェデレーション（WIF）の設定があればそれを使い、
      # なければ Secret の ANTHROPIC_API_KEY を使う（後述の2つのステップで切り替える）。
      # ANTHROPIC_API_KEY は WIF より優先されるため、WIF のときは環境に置かない。
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: pip install
        run: pip install -r requirements.txt
      - name: Use API key
        if: vars.ANTHROPIC_FEDERATION_RULE_ID == ''
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Fetch GitHub OIDC token
        if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
      - name: Check Claude auth
        if: inputs.auth_check
        run: python tools/check_claude_auth.py
      - name: Try reply
        if: ${{ !inputs.auth_check && inputs.test_message != '' }}
        env:
          TEST_MESSAGE_RAW: ${{ inputs.test_message }}
        # workflow_dispatch の入力は1行なので、「/」区切りを改行に直して渡す
        run: TEST_MESSAGE="$(printf '%s' "$TEST_MESSAGE_RAW" | tr '/' '\n')" python tools/try_reply.py
      - name: Reply
        if: ${{ !inputs.auth_check && !inputs.test_message }}
        run: python reply.py
